function showEstado(uf) {
  var d = window.__ESTADOS__ && window.__ESTADOS__[uf];
  if (!d) return;

  var probsHtml = '';
  d.problemas.forEach(function(p) {
    var icon = p.nivel === 'EMERGENCIA' ? '🚨' : (p.nivel === 'ALTA' ? '⚠️' : '📍');
    var cor = p.nivel === 'EMERGENCIA' ? '#8B1A1A' : (p.nivel === 'ALTA' ? '#D4A017' : '#3D5A80');
    probsHtml += '<div style="padding:10px 0;border-bottom:1px solid #30363d;">' +
      '<div style="font-size:0.85rem;font-weight:700;color:' + cor + ';">' + icon + ' [' + p.cargo + '] ' + p.problema + '</div>' +
      '<div style="font-size:0.75rem;color:#8b949e;margin-top:4px;">Indicador: ' + p.indicador + '</div>' +
      '<div style="font-size:0.75rem;color:#8b949e;">Meta: ' + p.meta + ' | Fonte: ' + p.fonte + '</div>' +
      '<div style="font-size:0.75rem;color:#2D6A4F;margin-top:4px;font-weight:600;">PROPOSTA EXIGIDA: ' + p.proposta + '</div>' +
      '</div>';
  });

  var html = '<h3 style="font-size:1.3rem;font-weight:900;margin-bottom:4px;">' + d.nome + ' (' + uf + ')</h3>' +
    '<p style="font-size:0.75rem;color:#8b949e;margin-bottom:16px;">' + d.regiao + ' · ' + d.populacao + 'M hab · <span style="color:' + d.color + ';font-weight:700;">' + d.status + '</span> · ' + d.n_emergencias + ' emergências</span></p>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">' +
    '<div style="background:#0d1117;padding:8px;border-radius:6px;text-align:center;"><div style="font-size:1.2rem;font-weight:900;color:#8B1A1A;">R$ ' + d.p50 + '</div><div style="font-size:0.65rem;color:#8b949e;">MEDIANA</div></div>' +
    '<div style="background:#0d1117;padding:8px;border-radius:6px;text-align:center;"><div style="font-size:1.2rem;font-weight:900;color:#8B1A1A;">' + d.indigencia + '%</div><div style="font-size:0.65rem;color:#8b949e;">INDIGÊNCIA</div></div>' +
    '<div style="background:#0d1117;padding:8px;border-radius:6px;text-align:center;"><div style="font-size:1.2rem;font-weight:900;color:#8B1A1A;">' + d.desigualdade + 'x</div><div style="font-size:0.65rem;color:#8b949e;">DESIGUALDADE</div></div>' +
    '<div style="background:#0d1117;padding:8px;border-radius:6px;text-align:center;"><div style="font-size:1.2rem;font-weight:900;color:#8B1A1A;">' + d.gap_racial.toFixed(2) + 'x</div><div style="font-size:0.65rem;color:#8b949e;">GAP RACIAL</div></div>' +
    '</div>' +
    '<div style="background:rgba(212,160,23,0.06);padding:10px;border-radius:6px;margin-bottom:16px;font-size:0.78rem;color:#8b949e;"><strong>Economia real:</strong> ' + d.economia + '</div>' +
    '<h4 style="font-size:0.9rem;font-weight:700;margin-bottom:8px;color:#D4A017;">Problemas (' + d.problemas.length + '):</h4>' +
    probsHtml +
    '<div style="margin-top:16px;background:rgba(45,106,79,0.08);padding:12px;border-radius:6px;">' +
    '<div style="font-size:0.78rem;font-weight:700;color:#2D6A4F;margin-bottom:6px;">DESAFIO POR CARGO:</div>' +
    '<div style="font-size:0.75rem;color:#e6edf3;margin-bottom:4px;">🏛️ <strong>GOVERNADOR:</strong> ' + d.desafio_gov + '</div>' +
    '<div style="font-size:0.75rem;color:#e6edf3;margin-bottom:4px;">📋 <strong>SENADOR:</strong> ' + d.desafio_sen + '</div>' +
    '<div style="font-size:0.75rem;color:#e6edf3;">📄 <strong>DEPUTADO:</strong> ' + d.desafio_dep + '</div>' +
    '</div>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('estado-modal').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('estado-modal').style.display = 'none';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});
</script>
