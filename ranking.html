let sortCol = -1;
let sortAsc = true;

function renderTable(filtered) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  filtered.forEach(p => {
    const tr = document.createElement('tr');
    const statusClass = p.status === 'APROVADO' ? 'aprovado' : 'reprovado';
    tr.innerHTML = `
      <td><strong>${p.nome}</strong></td>
      <td class="score">${p.score.toFixed(2)}</td>
      <td>${p.c1.toFixed(2)}</td>
      <td>${p.c2.toFixed(2)}</td>
      <td>${p.c3.toFixed(2)}</td>
      <td><span class="badge ${statusClass}">${p.status}</span></td>
      <td style="font-size:13px;max-width:420px">${p.evidencia}</td>
    `;
    tbody.appendChild(tr);
  });
}

function filterAndSort() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const st = document.getElementById('status').value;
  let filtered = DATA.filter(p => {
    const matchName = !q || p.nome.toLowerCase().includes(q);
    const matchStatus = !st || p.status === st;
    return matchName && matchStatus;
  });
  if (sortCol !== -1) {
    const keyMap = ['nome','score','c1','c2','c3','status'];
    const k = keyMap[sortCol];
    filtered.sort((a,b) => {
      let va = a[k], vb = b[k];
      if (typeof va === 'string') {
        return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
      }
      return sortAsc ? va - vb : vb - va;
    });
  }
  renderTable(filtered);
}

function sortTable(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = col !== 0; }
  filterAndSort();
}

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('status').value = '';
  sortCol = -1;
  filterAndSort();
}

document.getElementById('search').addEventListener('input', filterAndSort);
document.getElementById('status').addEventListener('change', filterAndSort);

renderTable(DATA);
</script>
