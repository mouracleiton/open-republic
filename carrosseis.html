              '<p style="color:rgba(255,255,255,0.6);font-size:0.7rem;line-height:1.5;">' + f.dados_chave + '</p>' +
              '<p class="footer-cover" style="color:rgba(255,255,255,0.4);margin-top:16px;">@openrepublic · github.com/mouracleiton/open-republic</p>' +
            '</div>' +
          '</div>' +
        '</div>';

    // EXAME slides
    var exameSlides = examesDaFrente.map(function(e, i) {
      var urgColor = e.urgencia_id === 'u1' ? '#8B1A1A' : e.urgencia_id === 'u2' ? '#C44536' : e.urgencia_id === 'u3' ? '#F4A261' : '#2D6A4F';
      return '<div class="slide slide-content ' + f.corClass + '">' +
        '<span class="slide-num">' + (i+2) + '/' + (examesDaFrente.length + 2) + '</span>' +
        '<div class="pill">' + e.urgencia + '</div>' +
        '<h3>' + e.dominio.toUpperCase() + '</h3>' +
        '<p class="slide-label">O QUE MEDE</p>' +
        '<p>' + e.exame_rotulo + '</p>' +
        '<div style="margin:16px 0;">' +
          '<div class="stat-label">Automação</div>' +
          '<div class="stat" style="font-size:1.8rem;color:' + (e.automacao_pct >= 75 ? '#2D6A4F' : e.automacao_pct >= 50 ? '#F4A261' : '#8B1A1A') + ';">' + e.automacao_pct + '%</div>' +
        '</div>' +
        '<ul>' +
          e.indicadores.slice(0,4).map(function(ind) { return '<li>• ' + ind + '</li>'; }).join('') +
        '</ul>' +
        '<div class="gap-box">' +
          '<strong>⚠ GAP:</strong> ' + e.gap.substring(0, 120) + (e.gap.length > 120 ? '...' : '') +
        '</div>' +
      '</div>';
    }).join('');

    // CTA slide
    var ctaSlide =
      '<div class="slide slide-cta ' + f.corClass + '" style="background:#0A2540;">' +
        '<div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--verde),var(--ciano));display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;color:white;margin-bottom:16px;">R</div>' +
        '<h3 style="color:white;">O Raio X custa<br>R$ 0.42 por brasileiro/ano</h3>' +
        '<p>Saber onde dói é o primeiro passo pra curar.</p>' +
        '<p style="font-size:0.7rem;color:#484f58;">@openrepublic<br>github.com/mouracleiton/open-republic</p>' +
      '</div>';

    // Navigation dots
    var navHint = '<p class="nav-hint">← Arraste para ver todos os ' + examesDaFrente.length + ' exames desta frente →</p>';

    return '<div class="frente-section">' +
      '<div class="frente-titulo" style="background:' + f.cor + '22; color:' + f.cor + ';">' + f.nome + '</div>' +
      '<p class="frente-sub">' + f.descricao + '</p>' +
      '<div class="carousel">' + coverSlide + exameSlides + ctaSlide + '</div>' +
      navHint +
    '</div>';
  }).join('');
}

window.addEventListener('load', renderCarrosseis);
</script>
</body>
</html>
